<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Conversor de temperatura</title>
</head>

<body>
    <div class="caixa">
        <h1>Conversor de temperatura</h1>
        <label class="labelCelsius">Celcius</label>
        <input class="inputCelsius" type="text" id="celsius" placeholder="Digite a temperatura em Celsius"><br>
        <label class="labelFahren">Fahrenheit</label>
        <input class="inputFahren" type="text" id="fahrenheit" placeholder="Digite a temperatura em Fahrenheit"><br>
        <label class="labelKelvin">Kelvin</label>
        <input class="inputKelvin" type="text" id="kelvin" placeholder="Digite a temperatura em Kelvin"><br>
    </div>
</body>
<script src="script.js" defer></script>

</html>
